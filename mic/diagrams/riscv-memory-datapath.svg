<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="910" viewBox="0 0 1500 910" role="img" aria-labelledby="title desc">
<title id="title">RISC-V five-stage pipeline — draw it from memory</title>
<desc id="desc">A simplified teaching datapath for ADD, ADDI, LW, SW and BEQ. Five evenly spaced stages show PC and instruction memory, registers and immediate generator, ALU and branch target adder, data memory, and writeback selection. Four pipeline registers separate the stages. Writeback returns to the register file. Branch target and branch-select feedback return from execute to fetch. Hazard and forwarding hardware and individual control wires are omitted.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172334;font-size:17px} .small{font-size:13px;fill:#596575}.mono{font-family:monospace;font-size:13px}.stage{font-size:23px;font-weight:700}.block{fill:#fff;stroke:#35465a;stroke-width:2}.wire{fill:none;stroke:#35465a;stroke-width:2.4;marker-end:url(#arrow);stroke-linejoin:round}.branch{stroke:#b84d24}.wb{stroke:#126e7d}.control{stroke:#b84d24;stroke-dasharray:6 5}.label{font-size:14px;paint-order:stroke;stroke:#fffdf8;stroke-width:5;stroke-linejoin:round}.num{font-size:17px;font-weight:700;fill:#fff}.bold{font-weight:700}
</style><rect width="1500" height="910" fill="#fffdf8"/>
<text x="40" y="39" font-size="25" font-weight="700">Five stages. One main path. Two returns.</text>
<text x="40" y="63" class="small">Study skeleton · ADD / ADDI / LW / SW / BEQ · branch resolved in EX · not a complete RV32 implementation</text>
<rect x="40" y="205" width="280" height="425" fill="#f5f1e5"/>
<text x="180" y="744" class="stage" text-anchor="middle">IF</text>
<text x="180" y="767" class="small" text-anchor="middle">Fetch</text>
<rect x="320" y="205" width="280" height="425" fill="#edf4ef"/>
<text x="460" y="744" class="stage" text-anchor="middle">ID</text>
<text x="460" y="767" class="small" text-anchor="middle">Decode</text>
<rect x="600" y="205" width="280" height="425" fill="#fcf0e8"/>
<text x="740" y="744" class="stage" text-anchor="middle">EX</text>
<text x="740" y="767" class="small" text-anchor="middle">Execute</text>
<rect x="880" y="205" width="280" height="425" fill="#edf2f8"/>
<text x="1020" y="744" class="stage" text-anchor="middle">MEM</text>
<text x="1020" y="767" class="small" text-anchor="middle">Memory</text>
<rect x="1160" y="205" width="280" height="425" fill="#eaf4f5"/>
<text x="1300" y="744" class="stage" text-anchor="middle">WB</text>
<text x="1300" y="767" class="small" text-anchor="middle">Writeback</text>
<path class="wire " d="M115 445H135"/>
