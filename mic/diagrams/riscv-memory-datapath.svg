<rect x="315" y="215" width="10" height="415" rx="2" fill="#c8ac63" stroke="#9b803f"/>
<text x="320" y="651" class="mono" text-anchor="middle">IF/ID</text>
<rect x="595" y="215" width="10" height="415" rx="2" fill="#c8ac63" stroke="#9b803f"/>
<text x="600" y="651" class="mono" text-anchor="middle">ID/EX</text>
<rect x="875" y="215" width="10" height="415" rx="2" fill="#c8ac63" stroke="#9b803f"/>
<text x="880" y="651" class="mono" text-anchor="middle">EX/MEM</text>
<rect x="1155" y="215" width="10" height="415" rx="2" fill="#c8ac63" stroke="#9b803f"/>
<text x="1160" y="651" class="mono" text-anchor="middle">MEM/WB</text>
<path class="block" d="M85 400L115 414V486L85 500Z"/>
<text x="100.0" y="524" class="small" text-anchor="middle">PCSrc</text>
<rect class="block" x="135" y="415" width="60" height="60" rx="5"/>
<text x="165.0" y="451.0" class="bold" text-anchor="middle">PC</text>
<rect class="block" x="225" y="385" width="75" height="120" rx="5"/>
<text x="262.5" y="445.0" class="bold" text-anchor="middle">Instr.</text>
<text x="262.5" y="468.0" class="small" text-anchor="middle">memory</text>
<rect class="block" x="105" y="225" width="80" height="40" rx="5"/>
<text x="145.0" y="251.0" class="bold" text-anchor="middle">+4</text>
<rect class="block" x="390" y="370" width="140" height="160" rx="5"/>
<text x="460.0" y="450.0" class="bold" text-anchor="middle">Registers</text>
<text x="460.0" y="473.0" class="small" text-anchor="middle">2 reads · 1 write</text>
<rect class="block" x="405" y="550" width="140" height="50" rx="5"/>
<text x="475.0" y="581.0" class="bold" text-anchor="middle">Immediate</text>
<rect class="block" x="390" y="315" width="145" height="40" rx="5"/>
<text x="462.5" y="341.0" class="bold" text-anchor="middle">Control</text>
<path class="block" d="M645 440L675 454V526L645 540Z"/>
<text x="660.0" y="564" class="small" text-anchor="middle">ALUSrc</text>
<path class="block" d="M740 370L845 405V485L740 520V462L760 445L740 428Z"/>
<text x="793" y="451" class="bold" text-anchor="middle">ALU</text>
<rect class="block" x="690" y="235" width="140" height="50" rx="5"/>
<text x="760.0" y="266.0" class="bold" text-anchor="middle">PC + imm</text>
<rect class="block" x="760" y="125" width="90" height="70" rx="5"/>
<text x="805.0" y="160.0" class="bold" text-anchor="middle">AND</text>
<text x="805.0" y="183.0" class="small" text-anchor="middle">Branch ∧ zero</text>
<rect class="block" x="975" y="385" width="140" height="150" rx="5"/>
<text x="1045.0" y="460.0" class="bold" text-anchor="middle">Data</text>
<text x="1045.0" y="483.0" class="small" text-anchor="middle">memory</text>
<path class="block" d="M1250 400L1280 414V496L1250 510Z"/>
<text x="1265.0" y="534" class="small" text-anchor="middle">MemToReg</text>
<text x="170" y="390" class="label " text-anchor="middle">address</text>
<text x="342" y="432" class="label " text-anchor="middle">instruction</text>
<text x="560" y="398" class="label " text-anchor="middle">rs1</text>
<text x="560" y="468" class="label " text-anchor="middle">rs2</text>
<text x="559" y="563" class="label " text-anchor="middle">imm</text>
<text x="900" y="431" class="label " text-anchor="middle">result / address</text>
<text x="1035" y="312" class="label " text-anchor="middle">ALU result bypass</text>
<text x="1195" y="467" class="label " text-anchor="middle">load</text>
<text x="790" y="588" class="label " text-anchor="middle">store data = rs2</text>
<text x="810" y="670" class="label " text-anchor="middle">writeback → rd</text>
<text x="405" y="83" class="label " text-anchor="middle">branch target = PC + immediate</text>
<text x="430" y="104" class="label " text-anchor="middle">PCSrc = Branch AND zero</text>
<text x="620" y="306" class="label " text-anchor="middle">PC</text>
<text x="813" y="217" class="label " text-anchor="middle">zero</text>
<circle cx="205" cy="445" r="3.5" fill="#35465a"/>
<circle cx="350" cy="445" r="3.5" fill="#35465a"/>
<circle cx="560" cy="480" r="3.5" fill="#35465a"/>
<circle cx="930" cy="445" r="3.5" fill="#35465a"/>
<text x="635" y="466" class="small" text-anchor="middle">0</text>
<text x="635" y="520" class="small" text-anchor="middle">1</text>
<text x="1239" y="417" class="small" text-anchor="middle">0</text>
<text x="1239" y="486" class="small" text-anchor="middle">1</text>
<text x="460" y="620" class="small" text-anchor="middle">PC, rs2, rd and control also cross the latches.</text>
<path d="M40 790H1440" stroke="#d8d3c6"/>
<circle cx="61" cy="824" r="13" fill="#24384c"/>
<text x="61" y="830" class="num" text-anchor="middle">1</text>
<text x="83" y="830" class="bold" text-anchor="start">Five columns</text>
<text x="48" y="859" class="small" text-anchor="start">Draw four latch bars.</text>
<circle cx="341" cy="824" r="13" fill="#24384c"/>
<text x="341" y="830" class="num" text-anchor="middle">2</text>
<text x="363" y="830" class="bold" text-anchor="start">Main path</text>
<text x="328" y="859" class="small" text-anchor="start">PC → IM → RF → ALU → DM → mux.</text>
<circle cx="621" cy="824" r="13" fill="#24384c"/>
<text x="621" y="830" class="num" text-anchor="middle">3</text>
<text x="643" y="830" class="bold" text-anchor="start">Three additions</text>
<text x="608" y="859" class="small" text-anchor="start">+4, immediate, ALUSrc mux.</text>
<circle cx="901" cy="824" r="13" fill="#24384c"/>
<text x="901" y="830" class="num" text-anchor="middle">4</text>
<text x="923" y="830" class="bold" text-anchor="start">Two returns</text>
<text x="888" y="859" class="small" text-anchor="start">Writeback below; branch above.</text>
<circle cx="1181" cy="824" r="13" fill="#24384c"/>
<text x="1181" y="830" class="num" text-anchor="middle">5</text>
<text x="1203" y="830" class="bold" text-anchor="start">Two side paths</text>
<text x="1168" y="859" class="small" text-anchor="start">rs2 → store; ALU → WB bypass.</text>
<text x="40" y="892" class="small" text-anchor="start">Then add hazard detection and forwarding only if the exam asks for them. Solid = data; dashed = branch control. Gold bars = pipeline registers.</text>
</svg>