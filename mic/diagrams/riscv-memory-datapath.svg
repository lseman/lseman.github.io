<path class="wire " d="M530 480H625V450H645"/>
<path class="wire " d="M530 575H625V520H645"/>
<path class="wire " d="M675 480H740"/>
<path class="wire " d="M845 445H975"/>
<path class="wire " d="M930 445V325H1210V420H1250"/>
<path class="wire " d="M560 480V600H950V500H975"/>
<path class="wire " d="M1115 480H1250"/>
<path class="wire wb" d="M1280 450H1370V680H370V515H390"/>
<path class="wire " d="M205 445V290H650V250H690"/>
<path class="wire " d="M545 575H570V275H690"/>
