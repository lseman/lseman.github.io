<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Superscalar = more issue slots</title><desc id="desc">Scalar issue starts up to one instruction per cycle; two-wide issue can start up to two independent operations. An in-order machine can still block a ready younger instruction behind an older waiting one.</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#35644c"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3d648a"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#855e25"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#74569a"/></marker><marker id="arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64766a"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d8e1d5"/></pattern></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#253b30}.eyebrow{font:600 11px system-ui;letter-spacing:1.6px;fill:#58715d}.heading{font-size:25px;font-weight:650;letter-spacing:-.6px}.node{font-size:16px;font-weight:650}.body{font-size:14px}.small{font-size:12px;fill:#52675a}.tag{font-size:11px;font-weight:650}.mono{font:12px ui-monospace,SFMono-Regular,Consolas,monospace}.foot{font-size:15px;font-weight:600}.axis{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#617669}</style><rect width="1000" height="500" rx="16" fill="#f7f9f4"/><rect width="1000" height="500" rx="16" fill="url(#dots)"/><text x="32" y="30" class="eyebrow" text-anchor="start">MEMORY MAP / 02</text><text x="32" y="65" class="heading" text-anchor="start">Superscalar = more issue slots</text><text x="44" y="101" class="eyebrow" text-anchor="start">SCALAR / WIDTH 1</text><text x="530" y="101" class="eyebrow" text-anchor="start">SUPERSCALAR / WIDTH 2</text><rect x="44" y="122" width="145" height="62" rx="12" fill="#e8f0e7" stroke="#35644c" stroke-opacity=".4"/><text x="60" y="150" class="node" text-anchor="start">Issue ×1</text><text x="60" y="171" class="small" text-anchor="start">one start / cycle</text><path d="M189 153H222" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><rect x="230" y="122" width="180" height="62" rx="12" fill="#eaf0f8" stroke="#3d648a" stroke-opacity=".4"/><text x="246" y="150" class="node" text-anchor="start">Execution</text><text x="246" y="171" class="small" text-anchor="start">one issued operation</text><rect x="530" y="122" width="145" height="116" rx="12" fill="#e8f0e7" stroke="#35644c" stroke-opacity=".4"/><text x="546" y="150" class="node" text-anchor="start">Issue ×2</text><text x="546" y="171" class="small" text-anchor="start">up to two starts</text><path d="M675 153H709" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><path d="M675 205H709" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><rect x="717" y="122" width="236" height="62" rx="12" fill="#eaf0f8" stroke="#3d648a" stroke-opacity=".4"/><text x="733" y="150" class="node" text-anchor="start">ALU lane A</text><text x="733" y="171" class="small" text-anchor="start">independent work</text><rect x="717" y="196" width="236" height="62" rx="12" fill="#eaf0f8" stroke="#3d648a" stroke-opacity=".4"/><text x="733" y="224" class="node" text-anchor="start">ALU lane B</text><text x="733" y="245" class="small" text-anchor="start">independent work</text><rect x="44" y="213" width="210" height="27" rx="13.5" fill="#f1ebf8"/><text x="149" y="231" class="tag" text-anchor="middle">WIDTH ≠ SCHEDULING POLICY</text><path d="M44 282H954" stroke="#d0dacb"/><text x="44" y="309" class="eyebrow" text-anchor="start">WHY TWO SLOTS CAN STILL GO UNUSED</text><rect x="44" y="330" width="260" height="70" rx="12" fill="#eaf0f8" stroke="#3d648a" stroke-opacity=".4"/><text x="60" y="358" class="node" text-anchor="start">I1 · long load</text><text x="60" y="379" class="small" text-anchor="start">produces x1</text><path d="M304 365H355" fill="none" stroke="#855e25" stroke-width="2"  marker-end="url(#arrow-amber)"/><rect x="363" y="330" width="270" height="70" rx="12" fill="#fcf0dc" stroke="#855e25" stroke-opacity=".4"/><text x="379" y="358" class="node" text-anchor="start">I2 · needs x1</text><text x="379" y="379" class="small" text-anchor="start">blocked: operand not ready</text><path d="M633 365H682" fill="none" stroke="#855e25" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/><rect x="690" y="330" width="263" height="70" rx="12" fill="#fff" stroke="#64766a" stroke-opacity=".4"/><text x="706" y="358" class="node" text-anchor="start">I3 · independent</text><text x="706" y="379" class="small" text-anchor="start">in-order issue: waits behind I2</text><text x="530" y="274" class="small" text-anchor="start">Illustrative ready pair; compatible units assumed.</text><rect x="24" y="442" width="952" height="42" rx="9" fill="#e4ecdf"/><text x="44" y="469" class="foot" text-anchor="start">REMEMBER  /  More lanes raise the ceiling. Dependencies and resources decide actual use.</text></svg>
