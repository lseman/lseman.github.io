<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">A two-wide in-order RISC-V datapath</title>
<desc id="desc">A simplified RV32I processor fetches and decodes two instructions, reads the register file and issues an ordered pair to two integer ALUs or a load/store unit. Results return through writeback and bypass paths. Branches redirect fetch; interlocks hold issue when dependencies or resources block the oldest instruction.</desc>
<defs><marker id="data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#367c77"/></marker><marker id="control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a36a2e"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#294237}.title{font-size:21px;font-weight:650}.stage{font-size:11px;font-weight:700;letter-spacing:1px;fill:#668073}.label{font-size:14px;font-weight:650}.small{font-size:11px;fill:#536b5d}.block{fill:#eaf2ec;stroke:#9bbcac}.unit{fill:#e9eff8;stroke:#aabdd3}.control{fill:#faf0df;stroke:#d6bf92}.wire{fill:none;stroke:#367c77;stroke-width:2;marker-end:url(#data)}.ctrl{fill:none;stroke:#a36a2e;stroke-width:1.7;stroke-dasharray:5 4;marker-end:url(#control)}</style>
<rect width="1000" height="420" fill="#f7f9f4"/>
<text x="24" y="31" class="title">Superscalar · a two-wide RV32I datapath</text>
<text x="30" y="59" class="stage">FETCH</text><text x="225" y="59" class="stage">DECODE / READ</text><text x="451" y="59" class="stage">ISSUE</text><text x="648" y="59" class="stage">EXECUTE / MEMORY</text><text x="865" y="59" class="stage">WRITEBACK</text>
<rect x="25" y="93" width="80" height="47" rx="6" class="block"/><text x="38" y="113" class="label">PC</text><text x="38" y="130" class="small">next PC</text>
<rect x="125" y="93" width="80" height="47" rx="6" class="block"/><text x="135" y="113" class="label">I-MEM</text><text x="135" y="130" class="small">2 × 32 bit</text>
<rect x="225" y="93" width="160" height="47" rx="6" class="block"/><text x="237" y="113" class="label">Decode ×2</text><text x="237" y="130" class="small">opcode · rs1 · rs2 · rd</text>
<rect x="225" y="175" width="160" height="60" rx="6" class="block"/><text x="237" y="197" class="label">Integer registers</text><text x="237" y="215" class="small">x0–x31 · operand reads</text><text x="237" y="229" class="small">+ immediate generation</text>
<rect x="445" y="93" width="155" height="67" rx="6" class="control"/><text x="457" y="115" class="label">Ordered issue ×2</text><text x="457" y="133" class="small">oldest ready instructions</text><text x="457" y="149" class="small">hazards + free units</text>
<rect x="445" y="195" width="155" height="52" rx="6" class="block"/><text x="457" y="216" class="label">Operand muxes</text><text x="457" y="234" class="small">register / immediate / bypass</text>
<path d="M650 80 H755 L743 130 H662 Z" class="unit"/><text x="672" y="100" class="label">ALU 0</text><text x="670" y="117" class="small">integer ops</text>
<path d="M650 153 H755 L743 203 H662 Z" class="unit"/><text x="672" y="173" class="label">ALU 1</text><text x="670" y="190" class="small">integer ops</text>
<rect x="650" y="226" width="105" height="55" rx="6" class="unit"/><text x="660" y="247" class="label">Load / store</text><text x="660" y="265" class="small">address + data</text>
<rect x="785" y="226" width="70" height="55" rx="6" class="block"/><text x="795" y="247" class="label">D-MEM</text><text x="795" y="265" class="small">data</text>
<rect x="870" y="121" width="105" height="75" rx="6" class="block"/><text x="880" y="144" class="label">Writeback</text><text x="880" y="161" class="small">select results</text><text x="880" y="178" class="small">commit in order</text>
<path class="wire" d="M105 116 H120"/><path class="wire" d="M205 116 H220"/><path class="wire" d="M385 116 H440"/><path class="wire" d="M305 140 V170"/><path class="wire" d="M385 205 H440"/>
<path class="wire" d="M600 208 H620 V105 H650"/><path class="wire" d="M600 221 H630 V178 H650"/><path class="wire" d="M600 234 H620 V253 H650"/>
<path class="wire" d="M755 105 H840 V143 H865"/><path class="wire" d="M755 178 H865"/><path class="wire" d="M755 253 H780"/><path class="wire" d="M855 253 H925 V201"/>
<path class="wire" d="M925 196 V315 H305 V240"/><text x="455" y="303" class="small">writeback to register file</text>
<path class="ctrl" d="M825 130 V335 H522 V252"/><text x="580" y="350" class="small">result bypass / dependency readiness</text>
<path class="ctrl" d="M702 80 V70 H65 V88"/><text x="305" y="86" class="small">branch / jump redirect</text>
<text x="25" y="388" class="small">Up to two instructions issue per cycle; an older blocked instruction can hold up younger work.</text>
<text x="25" y="406" class="small">Conceptual hardware: actual port counts, branch placement, memory timing, and issue rules vary by implementation.</text>
</svg>
