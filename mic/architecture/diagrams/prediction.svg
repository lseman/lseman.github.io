<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Branch prediction = speculate, check, recover</title><desc id="desc">Predict a next PC, fetch speculatively and resolve the branch. A matching PC continues; a mismatch flushes younger instructions and redirects fetch. A two-bit direction counter moves toward taken or not taken and saturates at either end.</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#35644c"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3d648a"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#855e25"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#74569a"/></marker><marker id="arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64766a"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d8e1d5"/></pattern></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#253b30}.eyebrow{font:600 11px system-ui;letter-spacing:1.6px;fill:#58715d}.heading{font-size:25px;font-weight:650;letter-spacing:-.6px}.node{font-size:16px;font-weight:650}.body{font-size:14px}.small{font-size:12px;fill:#52675a}.tag{font-size:11px;font-weight:650}.mono{font:12px ui-monospace,SFMono-Regular,Consolas,monospace}.foot{font-size:15px;font-weight:600}.axis{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#617669}</style><rect width="1000" height="500" rx="16" fill="#f7f9f4"/><rect width="1000" height="500" rx="16" fill="url(#dots)"/><text x="32" y="30" class="eyebrow" text-anchor="start">MEMORY MAP / 04</text><text x="32" y="65" class="heading" text-anchor="start">Branch prediction = speculate, check, recover</text><rect x="32" y="104" width="185" height="66" rx="12" fill="#f1ebf8" stroke="#74569a" stroke-opacity=".4"/><text x="48" y="132" class="node" text-anchor="start">1 · Predict</text><text x="48" y="153" class="small" text-anchor="start">direction + target</text><path d="M217 137H249" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><rect x="257" y="104" width="219" height="66" rx="12" fill="#eaf0f8" stroke="#3d648a" stroke-opacity=".4"/><text x="273" y="132" class="node" text-anchor="start">2 · Fetch / execute</text><text x="273" y="153" class="small" text-anchor="start">younger work is speculative</text><path d="M476 137H508" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><rect x="516" y="104" width="209" height="66" rx="12" fill="#fff" stroke="#64766a" stroke-opacity=".4"/><text x="532" y="132" class="node" text-anchor="start">3 · Resolve branch</text><text x="532" y="153" class="small" text-anchor="start">actual next PC is known</text><path d="M725 137H758" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><path d="M815 91L878 137L815 183L752 137Z" fill="#f1ebf8" stroke="#74569a" stroke-opacity=".5"/><text x="815" y="134" class="node" text-anchor="middle">PC</text><text x="815" y="153" class="small" text-anchor="middle">matches?</text><path d="M878 137H928V218H714" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><text x="898" y="192" class="tag" text-anchor="start">YES</text><rect x="516" y="203" width="190" height="61" rx="12" fill="#e8f0e7" stroke="#35644c" stroke-opacity=".4"/><text x="532" y="231" class="node" text-anchor="start">Continue</text><text x="532" y="252" class="small" text-anchor="start">keep predicted-path work</text><path d="M815 183V291H714" fill="none" stroke="#855e25" stroke-width="2"  marker-end="url(#arrow-amber)"/><text x="833" y="287" class="tag" text-anchor="start">NO</text><rect x="516" y="276" width="190" height="61" rx="12" fill="#fcf0dc" stroke="#855e25" stroke-opacity=".4"/><text x="532" y="304" class="node" text-anchor="start">Flush + redirect</text><text x="532" y="325" class="small" text-anchor="start">discard wrong path</text><path d="M516 306H124V178" fill="none" stroke="#855e25" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/><text x="145" y="289" class="small" text-anchor="start">recover the correct next PC</text><text x="32" y="366" class="eyebrow" text-anchor="start">DIRECTION MEMORY / 2-BIT SATURATING COUNTER</text><rect x="32" y="380" width="204" height="44" rx="12" fill="#fff" stroke="#64766a" stroke-opacity=".4"/><text x="48" y="408" class="node" text-anchor="start">0 · Strong NT</text><path d="M239 394H269" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><path d="M269 413H239" fill="none" stroke="#855e25" stroke-width="2"  marker-end="url(#arrow-amber)"/><rect x="275" y="380" width="204" height="44" rx="12" fill="#fff" stroke="#64766a" stroke-opacity=".4"/><text x="291" y="408" class="node" text-anchor="start">1 · Weak NT</text><path d="M482 394H512" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><path d="M512 413H482" fill="none" stroke="#855e25" stroke-width="2"  marker-end="url(#arrow-amber)"/><rect x="518" y="380" width="204" height="44" rx="12" fill="#e8f0e7" stroke="#35644c" stroke-opacity=".4"/><text x="534" y="408" class="node" text-anchor="start">2 · Weak T</text><path d="M725 394H755" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><path d="M755 413H725" fill="none" stroke="#855e25" stroke-width="2"  marker-end="url(#arrow-amber)"/><rect x="761" y="380" width="204" height="44" rx="12" fill="#e8f0e7" stroke="#35644c" stroke-opacity=".4"/><text x="777" y="408" class="node" text-anchor="start">3 · Strong T</text><text x="620" y="366" class="small" text-anchor="start">Taken →   /   ← Not taken; clamp at endpoints</text><rect x="24" y="442" width="952" height="42" rx="9" fill="#e4ecdf"/><text x="44" y="469" class="foot" text-anchor="start">REMEMBER  /  Taken does not mean wrong. Recovery depends on the predicted versus actual PC.</text></svg>
