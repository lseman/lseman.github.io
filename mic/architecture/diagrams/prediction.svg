<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Branch prediction · fetch, resolve, recover</title><desc id="desc">The fetch PC indexes a predictor. Prediction metadata travels through the pipeline; branch resolution compares actual and predicted next PCs and redirects on a mismatch.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#367c77"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a36a2e"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#294237}.title{font-size:21px;font-weight:650}.stage{font-size:11px;font-weight:700;letter-spacing:1px;fill:#668073}.label{font-size:14px;font-weight:650}.small{font-size:11px;fill:#536b5d}.block{fill:#eaf2ec;stroke:#9bbcac}.unit{fill:#e9eff8;stroke:#aabdd3}.control{fill:#faf0df;stroke:#d6bf92}.wire{fill:none;stroke:#367c77;stroke-width:2;marker-end:url(#a)}.ctrl{fill:none;stroke:#a36a2e;stroke-width:1.7;stroke-dasharray:5 4;marker-end:url(#c)}</style><rect width="1000" height="420" fill="#f7f9f4"/><text x="24" y="31" class="title">Branch prediction · fetch, resolve, recover</text><text x="25" y="59" class="stage">FETCH</text><text x="240" y="59" class="stage">PREDICT</text><text x="470" y="59" class="stage">PIPELINE</text><text x="715" y="59" class="stage">RESOLVE / RECOVER</text><rect x="25" y="95" width="115" height="50" rx="6" class="block"/><text x="35" y="115" class="label">PC / mux</text><text x="35" y="132" class="small">next fetch address</text><rect x="175" y="95" width="160" height="50" rx="6" class="block"/><text x="185" y="115" class="label">Instruction memory</text><text x="185" y="132" class="small">fetch instruction</text><rect x="370" y="95" width="150" height="50" rx="6" class="block"/><text x="380" y="115" class="label">IF / ID register</text><text x="380" y="132" class="small">PC + instruction</text><rect x="555" y="95" width="150" height="50" rx="6" class="block"/><text x="565" y="115" class="label">ID / EX register</text><text x="565" y="132" class="small">operands + metadata</text><rect x="745" y="95" width="215" height="65" rx="6" class="unit"/><text x="755" y="115" class="label">Branch / jump unit</text><text x="755" y="132" class="small">actual direction + target</text><text x="755" y="147" class="small">compare predicted next PC</text><rect x="175" y="205" width="160" height="65" rx="6" class="control"/><text x="185" y="225" class="label">Fetch predictor</text><text x="185" y="242" class="small">BTB target + direction</text><text x="185" y="257" class="small">lookup by fetch PC</text><rect x="405" y="205" width="220" height="65" rx="6" class="block"/><text x="415" y="225" class="label">Prediction metadata</text><text x="415" y="242" class="small">predicted next PC + index</text><text x="415" y="257" class="small">travel with instruction</text><rect x="745" y="205" width="215" height="65" rx="6" class="control"/><text x="755" y="225" class="label">Recovery / training</text><text x="755" y="242" class="small">mismatch → flush + redirect</text><text x="755" y="257" class="small">update predictor on resolution</text><path class="wire" d="M140 120 H170"/><path class="wire" d="M335 120 H365"/><path class="wire" d="M520 120 H550"/><path class="wire" d="M705 120 H740"/><path class="wire" d="M85 145 V237 H170"/><path class="wire" d="M335 237 H400"/><path class="wire" d="M625 237 H685 V140 H740"/><path class="ctrl" d="M852 160 V200"/><path class="ctrl" d="M745 237 H700 V315 H100 V150"/><path class="ctrl" d="M745 250 H720 V340 H255 V275"/><text x="285" y="306" class="small">redirect fetch + squash younger instructions</text><text x="285" y="356" class="small">train direction and target tables</text><text x="25" y="395" class="small">Correct predictions continue; recovery is needed when the predicted and actual next PCs differ.</text></svg>