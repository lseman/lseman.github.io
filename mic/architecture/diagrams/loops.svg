<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Loop caches = reuse the instruction source</title><desc id="desc">Dynamic capture and static software-selected regions are two ways to populate nearby instruction storage. A valid buffered instruction uses the loop buffer; otherwise fetch reads instruction memory. This does not change issue policy.</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#35644c"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3d648a"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#855e25"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#74569a"/></marker><marker id="arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64766a"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d8e1d5"/></pattern></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#253b30}.eyebrow{font:600 11px system-ui;letter-spacing:1.6px;fill:#58715d}.heading{font-size:25px;font-weight:650;letter-spacing:-.6px}.node{font-size:16px;font-weight:650}.body{font-size:14px}.small{font-size:12px;fill:#52675a}.tag{font-size:11px;font-weight:650}.mono{font:12px ui-monospace,SFMono-Regular,Consolas,monospace}.foot{font-size:15px;font-weight:600}.axis{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#617669}</style><rect width="1000" height="500" rx="16" fill="#f7f9f4"/><rect width="1000" height="500" rx="16" fill="url(#dots)"/><text x="32" y="30" class="eyebrow" text-anchor="start">MEMORY MAP / 05</text><text x="32" y="65" class="heading" text-anchor="start">Loop caches = reuse the instruction source</text><rect x="358" y="101" width="284" height="68" rx="12" fill="#e8f0e7" stroke="#35644c" stroke-opacity=".4"/><text x="374" y="129" class="node" text-anchor="start">Instruction reuse</text><text x="374" y="150" class="small" text-anchor="start">same code · nearby storage</text><path d="M358 135H220V199" fill="none" stroke="#3d648a" stroke-width="2"  marker-end="url(#arrow-blue)"/><path d="M642 135H780V199" fill="none" stroke="#74569a" stroke-width="2"  marker-end="url(#arrow-purple)"/><rect x="44" y="207" width="355" height="70" rx="12" fill="#eaf0f8" stroke="#3d648a" stroke-opacity=".4"/><text x="60" y="235" class="node" text-anchor="start">DYNAMIC · hardware learns the loop</text><text x="60" y="256" class="small" text-anchor="start">backward branch → detect → fill → replay</text><rect x="600" y="207" width="355" height="70" rx="12" fill="#f1ebf8" stroke="#74569a" stroke-opacity=".4"/><text x="616" y="235" class="node" text-anchor="start">STATIC · software selects regions</text><text x="616" y="256" class="small" text-anchor="start">select → preload → configure PC ranges</text><path d="M221 277V313H420V332" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><path d="M777 277V313H580V332" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><rect x="358" y="340" width="284" height="66" rx="12" fill="#e8f0e7" stroke="#35644c" stroke-opacity=".4"/><text x="374" y="368" class="node" text-anchor="start">Valid buffered instruction?</text><text x="374" y="389" class="small" text-anchor="start">controller / region lookup</text><path d="M358 373H280" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><text x="292" y="358" class="tag" text-anchor="start">YES</text><rect x="44" y="340" width="228" height="66" rx="12" fill="#e8f0e7" stroke="#35644c" stroke-opacity=".4"/><text x="60" y="368" class="node" text-anchor="start">Read loop buffer</text><text x="60" y="389" class="small" text-anchor="start">avoid this IMEM read</text><path d="M642 373H719" fill="none" stroke="#855e25" stroke-width="2"  marker-end="url(#arrow-amber)"/><text x="672" y="358" class="tag" text-anchor="start">NO</text><rect x="727" y="340" width="228" height="66" rx="12" fill="#fcf0dc" stroke="#855e25" stroke-opacity=".4"/><text x="743" y="368" class="node" text-anchor="start">Read IMEM</text><text x="743" y="389" class="small" text-anchor="start">normal instruction source</text><rect x="374" y="179" width="252" height="27" rx="13.5" fill="#fff"/><text x="500" y="197" class="tag" text-anchor="middle">FETCH SOURCE ≠ ISSUE POLICY</text><rect x="24" y="442" width="952" height="42" rx="9" fill="#e4ecdf"/><text x="44" y="469" class="foot" text-anchor="start">REMEMBER  /  Buffer hits reduce IMEM reads; they do not by themselves specify speedup.</text></svg>
