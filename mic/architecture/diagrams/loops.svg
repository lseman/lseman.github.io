<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Loop buffers · a closer instruction source</title><desc id="desc">The fetch PC selects between instruction memory and a loop buffer; dynamic detection or static configuration controls buffer contents.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#367c77"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a36a2e"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#294237}.title{font-size:21px;font-weight:650}.stage{font-size:11px;font-weight:700;letter-spacing:1px;fill:#668073}.label{font-size:14px;font-weight:650}.small{font-size:11px;fill:#536b5d}.block{fill:#eaf2ec;stroke:#9bbcac}.unit{fill:#e9eff8;stroke:#aabdd3}.control{fill:#faf0df;stroke:#d6bf92}.wire{fill:none;stroke:#367c77;stroke-width:2;marker-end:url(#a)}.ctrl{fill:none;stroke:#a36a2e;stroke-width:1.7;stroke-dasharray:5 4;marker-end:url(#c)}</style><rect width="1000" height="420" fill="#f7f9f4"/><text x="24" y="31" class="title">Loop buffers · a closer instruction source</text><text x="25" y="59" class="stage">FETCH ADDRESS</text><text x="245" y="59" class="stage">INSTRUCTION SOURCES</text><text x="520" y="59" class="stage">SELECT / DECODE</text><text x="780" y="59" class="stage">BUFFER MANAGEMENT</text><rect x="25" y="115" width="140" height="55" rx="6" class="block"/><text x="35" y="135" class="label">PC / next PC</text><text x="35" y="152" class="small">sequential or branch</text><rect x="245" y="85" width="175" height="55" rx="6" class="block"/><text x="255" y="105" class="label">Instruction memory</text><text x="255" y="122" class="small">fallback source</text><rect x="245" y="190" width="175" height="65" rx="6" class="unit"/><text x="255" y="210" class="label">Loop buffer</text><text x="255" y="227" class="small">cached instructions</text><text x="255" y="242" class="small">valid tags / PC range</text><rect x="515" y="125" width="150" height="65" rx="6" class="block"/><text x="525" y="145" class="label">Fetch source mux</text><text x="525" y="162" class="small">buffer hit / miss</text><text x="525" y="177" class="small">then decode</text><rect x="735" y="85" width="230" height="65" rx="6" class="control"/><text x="745" y="105" class="label">Dynamic control</text><text x="745" y="122" class="small">detect backward loop</text><text x="745" y="137" class="small">fill then replay</text><rect x="735" y="200" width="230" height="65" rx="6" class="control"/><text x="745" y="220" class="label">Static configuration</text><text x="745" y="237" class="small">software selects region</text><text x="745" y="252" class="small">preload + PC range</text><path class="wire" d="M165 135 H200 V112 H240"/><path class="wire" d="M165 145 H210 V222 H240"/><path class="wire" d="M420 112 H475 V145 H510"/><path class="wire" d="M420 222 H475 V170 H510"/><path class="wire" d="M665 157 H700"/><text x="670" y="181" class="label">to decode →</text><path class="ctrl" d="M735 115 H720 V290 H330 V260"/><path class="ctrl" d="M735 230 H710 V310 H345 V260"/><text x="430" y="304" class="small">detect / fill</text><text x="430" y="324" class="small">configure / preload</text><text x="25" y="365" class="small">A hit supplies an instruction from nearby storage; a miss falls back to instruction memory.</text><text x="25" y="392" class="small">Buffering changes the fetch source, independently of issue width or instruction scheduling.</text></svg>