<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Pipelining = overlap, not instant execution</title><desc id="desc">Five pipeline stages above a five-instruction, nine-cycle timeline. Each instruction takes five stages. The first finishes at cycle five and the last at cycle nine.</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#35644c"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3d648a"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#855e25"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#74569a"/></marker><marker id="arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64766a"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d8e1d5"/></pattern></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#253b30}.eyebrow{font:600 11px system-ui;letter-spacing:1.6px;fill:#58715d}.heading{font-size:25px;font-weight:650;letter-spacing:-.6px}.node{font-size:16px;font-weight:650}.body{font-size:14px}.small{font-size:12px;fill:#52675a}.tag{font-size:11px;font-weight:650}.mono{font:12px ui-monospace,SFMono-Regular,Consolas,monospace}.foot{font-size:15px;font-weight:600}.axis{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#617669}</style><rect width="1000" height="500" rx="16" fill="#f7f9f4"/><rect width="1000" height="500" rx="16" fill="url(#dots)"/><text x="32" y="30" class="eyebrow" text-anchor="start">MEMORY MAP / 01</text><text x="32" y="65" class="heading" text-anchor="start">Pipelining = overlap, not instant execution</text><rect x="44" y="97" width="166" height="60" rx="12" fill="#e8f0e7" stroke="#35644c" stroke-opacity=".4"/><text x="60" y="125" class="node" text-anchor="start">IF · fetch</text><text x="60" y="146" class="small" text-anchor="start">one stage / clock</text><path d="M210 127H230" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><rect x="234" y="97" width="166" height="60" rx="12" fill="#eaf0f8" stroke="#3d648a" stroke-opacity=".4"/><text x="250" y="125" class="node" text-anchor="start">ID · decode</text><text x="250" y="146" class="small" text-anchor="start">one stage / clock</text><path d="M400 127H420" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><rect x="424" y="97" width="166" height="60" rx="12" fill="#e8f0e7" stroke="#35644c" stroke-opacity=".4"/><text x="440" y="125" class="node" text-anchor="start">EX · execute</text><text x="440" y="146" class="small" text-anchor="start">one stage / clock</text><path d="M590 127H610" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><rect x="614" y="97" width="166" height="60" rx="12" fill="#eaf0f8" stroke="#3d648a" stroke-opacity=".4"/><text x="630" y="125" class="node" text-anchor="start">MEM · memory</text><text x="630" y="146" class="small" text-anchor="start">one stage / clock</text><path d="M780 127H800" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><rect x="804" y="97" width="166" height="60" rx="12" fill="#e8f0e7" stroke="#35644c" stroke-opacity=".4"/><text x="820" y="125" class="node" text-anchor="start">WB · write</text><text x="820" y="146" class="small" text-anchor="start">one stage / clock</text><text x="44" y="195" class="eyebrow" text-anchor="start">ONE INSTRUCTION: FIVE STAGES OF LATENCY</text><text x="700" y="195" class="eyebrow" text-anchor="start">MANY INSTRUCTIONS: OVERLAP</text><text x="171" y="222" class="axis" text-anchor="middle">C1</text><text x="257" y="222" class="axis" text-anchor="middle">C2</text><text x="343" y="222" class="axis" text-anchor="middle">C3</text><text x="429" y="222" class="axis" text-anchor="middle">C4</text><text x="515" y="222" class="axis" text-anchor="middle">C5</text><text x="601" y="222" class="axis" text-anchor="middle">C6</text><text x="687" y="222" class="axis" text-anchor="middle">C7</text><text x="773" y="222" class="axis" text-anchor="middle">C8</text><text x="859" y="222" class="axis" text-anchor="middle">C9</text><text x="60" y="253" class="mono" text-anchor="start">I1</text><rect x="134" y="233" width="75" height="27" rx="5" fill="#dcebdd"/><text x="171" y="251" class="mono" text-anchor="middle">IF</text><rect x="220" y="233" width="75" height="27" rx="5" fill="#dcebdd"/><text x="257" y="251" class="mono" text-anchor="middle">ID</text><rect x="306" y="233" width="75" height="27" rx="5" fill="#dcebdd"/><text x="343" y="251" class="mono" text-anchor="middle">EX</text><rect x="392" y="233" width="75" height="27" rx="5" fill="#dcebdd"/><text x="429" y="251" class="mono" text-anchor="middle">MEM</text><rect x="478" y="233" width="75" height="27" rx="5" fill="#dcebdd"/><text x="515" y="251" class="mono" text-anchor="middle">WB</text><rect x="564" y="233" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="650" y="233" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="736" y="233" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="822" y="233" width="75" height="27" rx="5" fill="#eef2ea"/><text x="60" y="287" class="mono" text-anchor="start">I2</text><rect x="134" y="267" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="220" y="267" width="75" height="27" rx="5" fill="#e7edf4"/><text x="257" y="285" class="mono" text-anchor="middle">IF</text><rect x="306" y="267" width="75" height="27" rx="5" fill="#e7edf4"/><text x="343" y="285" class="mono" text-anchor="middle">ID</text><rect x="392" y="267" width="75" height="27" rx="5" fill="#e7edf4"/><text x="429" y="285" class="mono" text-anchor="middle">EX</text><rect x="478" y="267" width="75" height="27" rx="5" fill="#e7edf4"/><text x="515" y="285" class="mono" text-anchor="middle">MEM</text><rect x="564" y="267" width="75" height="27" rx="5" fill="#e7edf4"/><text x="601" y="285" class="mono" text-anchor="middle">WB</text><rect x="650" y="267" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="736" y="267" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="822" y="267" width="75" height="27" rx="5" fill="#eef2ea"/><text x="60" y="321" class="mono" text-anchor="start">I3</text><rect x="134" y="301" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="220" y="301" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="306" y="301" width="75" height="27" rx="5" fill="#e7edf4"/><text x="343" y="319" class="mono" text-anchor="middle">IF</text><rect x="392" y="301" width="75" height="27" rx="5" fill="#e7edf4"/><text x="429" y="319" class="mono" text-anchor="middle">ID</text><rect x="478" y="301" width="75" height="27" rx="5" fill="#e7edf4"/><text x="515" y="319" class="mono" text-anchor="middle">EX</text><rect x="564" y="301" width="75" height="27" rx="5" fill="#e7edf4"/><text x="601" y="319" class="mono" text-anchor="middle">MEM</text><rect x="650" y="301" width="75" height="27" rx="5" fill="#e7edf4"/><text x="687" y="319" class="mono" text-anchor="middle">WB</text><rect x="736" y="301" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="822" y="301" width="75" height="27" rx="5" fill="#eef2ea"/><text x="60" y="355" class="mono" text-anchor="start">I4</text><rect x="134" y="335" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="220" y="335" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="306" y="335" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="392" y="335" width="75" height="27" rx="5" fill="#e7edf4"/><text x="429" y="353" class="mono" text-anchor="middle">IF</text><rect x="478" y="335" width="75" height="27" rx="5" fill="#e7edf4"/><text x="515" y="353" class="mono" text-anchor="middle">ID</text><rect x="564" y="335" width="75" height="27" rx="5" fill="#e7edf4"/><text x="601" y="353" class="mono" text-anchor="middle">EX</text><rect x="650" y="335" width="75" height="27" rx="5" fill="#e7edf4"/><text x="687" y="353" class="mono" text-anchor="middle">MEM</text><rect x="736" y="335" width="75" height="27" rx="5" fill="#e7edf4"/><text x="773" y="353" class="mono" text-anchor="middle">WB</text><rect x="822" y="335" width="75" height="27" rx="5" fill="#eef2ea"/><text x="60" y="389" class="mono" text-anchor="start">I5</text><rect x="134" y="369" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="220" y="369" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="306" y="369" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="392" y="369" width="75" height="27" rx="5" fill="#eef2ea"/><rect x="478" y="369" width="75" height="27" rx="5" fill="#e7edf4"/><text x="515" y="387" class="mono" text-anchor="middle">IF</text><rect x="564" y="369" width="75" height="27" rx="5" fill="#e7edf4"/><text x="601" y="387" class="mono" text-anchor="middle">ID</text><rect x="650" y="369" width="75" height="27" rx="5" fill="#e7edf4"/><text x="687" y="387" class="mono" text-anchor="middle">EX</text><rect x="736" y="369" width="75" height="27" rx="5" fill="#e7edf4"/><text x="773" y="387" class="mono" text-anchor="middle">MEM</text><rect x="822" y="369" width="75" height="27" rx="5" fill="#e7edf4"/><text x="859" y="387" class="mono" text-anchor="middle">WB</text><text x="44" y="425" class="small" text-anchor="start">Ideal, single issue · empty start · no stalls or flushes</text><rect x="24" y="442" width="952" height="42" rx="9" fill="#e4ecdf"/><text x="44" y="469" class="foot" text-anchor="start">REMEMBER  /  Latency: 5 stages. Ideal throughput when full: 1 instruction per cycle.</text></svg>
