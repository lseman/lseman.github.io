<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Out of order = follow readiness, preserve results</title><desc id="desc">Renaming and an instruction window feed a scheduler. I2 waits for a true load dependency while independent I3 executes. A reorder buffer commits I1, I2 and I3 in program order.</desc><defs><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#35644c"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#3d648a"/></marker><marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#855e25"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#74569a"/></marker><marker id="arrow-plain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64766a"/></marker><pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#d8e1d5"/></pattern></defs><style>text{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#253b30}.eyebrow{font:600 11px system-ui;letter-spacing:1.6px;fill:#58715d}.heading{font-size:25px;font-weight:650;letter-spacing:-.6px}.node{font-size:16px;font-weight:650}.body{font-size:14px}.small{font-size:12px;fill:#52675a}.tag{font-size:11px;font-weight:650}.mono{font:12px ui-monospace,SFMono-Regular,Consolas,monospace}.foot{font-size:15px;font-weight:600}.axis{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#617669}</style><rect width="1000" height="500" rx="16" fill="#f7f9f4"/><rect width="1000" height="500" rx="16" fill="url(#dots)"/><text x="32" y="30" class="eyebrow" text-anchor="start">MEMORY MAP / 03</text><text x="32" y="65" class="heading" text-anchor="start">Out of order = follow readiness, preserve results</text><rect x="32" y="105" width="174" height="66" rx="12" fill="#f1ebf8" stroke="#74569a" stroke-opacity=".4"/><text x="48" y="133" class="node" text-anchor="start">1 · Rename</text><text x="48" y="154" class="small" text-anchor="start">distinct versions</text><path d="M206 138H236" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><rect x="244" y="105" width="270" height="66" rx="12" fill="#eaf0f8" stroke="#3d648a" stroke-opacity=".4"/><text x="260" y="133" class="node" text-anchor="start">2 · Instruction window</text><text x="260" y="154" class="small" text-anchor="start">keep true data dependencies</text><path d="M379 171V204H200V225" fill="none" stroke="#855e25" stroke-width="2"  marker-end="url(#arrow-amber)"/><path d="M379 171V204H565V225" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><rect x="49" y="234" width="297" height="68" rx="12" fill="#fcf0dc" stroke="#855e25" stroke-opacity=".4"/><text x="65" y="262" class="node" text-anchor="start">I2 · waiting for I1’s load</text><text x="65" y="283" class="small" text-anchor="start">RAW dependency remains</text><rect x="414" y="234" width="297" height="68" rx="12" fill="#e8f0e7" stroke="#35644c" stroke-opacity=".4"/><text x="430" y="262" class="node" text-anchor="start">I3 · ready and independent</text><text x="430" y="283" class="small" text-anchor="start">3 · select → execute → finish</text><text x="49" y="328" class="small" text-anchor="start">Cannot execute yet</text><text x="414" y="328" class="small" text-anchor="start">Can finish before I2</text><path d="M711 267H729V86H854V105" fill="none" stroke="#35644c" stroke-width="2"  marker-end="url(#arrow-green)"/><rect x="739" y="105" width="229" height="66" rx="12" fill="#f1ebf8" stroke="#74569a" stroke-opacity=".4"/><text x="755" y="133" class="node" text-anchor="start">Reorder buffer</text><text x="755" y="154" class="small" text-anchor="start">4 · commit oldest first</text><text x="740" y="207" class="eyebrow" text-anchor="start">PROGRAM ORDER</text><rect x="751" y="223" width="205" height="49" rx="12" fill="#fcf0dc" stroke="#855e25" stroke-opacity=".4"/><text x="767" y="251" class="node" text-anchor="start">I1 · load</text><rect x="751" y="284" width="205" height="49" rx="12" fill="#fcf0dc" stroke="#855e25" stroke-opacity=".4"/><text x="767" y="312" class="node" text-anchor="start">I2 · waiting</text><rect x="751" y="345" width="205" height="49" rx="12" fill="#e8f0e7" stroke="#35644c" stroke-opacity=".4"/><text x="767" y="373" class="node" text-anchor="start">I3 · done</text><text x="414" y="381" class="eyebrow" text-anchor="start">FINISHED ≠ COMMITTED</text><text x="414" y="405" class="body" text-anchor="start">I3 waits for older work to commit.</text><rect x="24" y="442" width="952" height="42" rx="9" fill="#e4ecdf"/><text x="44" y="469" class="foot" text-anchor="start">REMEMBER  /  Rename removes false dependencies. Ready work executes; oldest work commits.</text></svg>
