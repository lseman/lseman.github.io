<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">Out of order · rename, schedule, commit</title><desc id="desc">A two-wide out-of-order RISC-V datapath uses renaming, physical registers, an issue window, execution units and an in-order reorder buffer.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#367c77"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a36a2e"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#294237}.title{font-size:21px;font-weight:650}.stage{font-size:11px;font-weight:700;letter-spacing:1px;fill:#668073}.label{font-size:14px;font-weight:650}.small{font-size:11px;fill:#536b5d}.block{fill:#eaf2ec;stroke:#9bbcac}.unit{fill:#e9eff8;stroke:#aabdd3}.control{fill:#faf0df;stroke:#d6bf92}.wire{fill:none;stroke:#367c77;stroke-width:2;marker-end:url(#a)}.ctrl{fill:none;stroke:#a36a2e;stroke-width:1.7;stroke-dasharray:5 4;marker-end:url(#c)}</style><rect width="1000" height="420" fill="#f7f9f4"/><text x="24" y="31" class="title">Out of order · rename, schedule, commit</text><text x="25" y="59" class="stage">FRONT END</text><text x="205" y="59" class="stage">RENAME / DISPATCH</text><text x="435" y="59" class="stage">SCHEDULE</text><text x="650" y="59" class="stage">EXECUTE</text><text x="850" y="59" class="stage">COMMIT</text><rect x="25" y="95" width="145" height="50" rx="6" class="block"/><text x="35" y="115" class="label">Fetch / decode ×2</text><text x="35" y="132" class="small">PC · instruction · rs / rd</text><rect x="205" y="95" width="175" height="65" rx="6" class="block"/><text x="215" y="115" class="label">Rename map</text><text x="215" y="132" class="small">architectural → physical</text><text x="215" y="147" class="small">allocate destination tags</text><rect x="205" y="202" width="175" height="65" rx="6" class="block"/><text x="215" y="222" class="label">Physical registers</text><text x="215" y="239" class="small">operand values + ready bits</text><text x="215" y="254" class="small">x0 remains zero</text><rect x="435" y="95" width="160" height="65" rx="6" class="control"/><text x="445" y="115" class="label">Issue window</text><text x="445" y="132" class="small">select ready instructions</text><text x="445" y="147" class="small">up to two per cycle</text><rect x="435" y="202" width="160" height="60" rx="6" class="control"/><text x="445" y="222" class="label">Wakeup / select</text><text x="445" y="239" class="small">match producer tags</text><text x="445" y="254" class="small">bypass completed results</text><rect x="650" y="76" width="135" height="48" rx="6" class="unit"/><text x="660" y="96" class="label">Integer ALU 0</text><text x="660" y="113" class="small">32-bit integer ops</text><rect x="650" y="145" width="135" height="48" rx="6" class="unit"/><text x="660" y="165" class="label">Integer ALU 1</text><text x="660" y="182" class="small">32-bit integer ops</text><rect x="650" y="214" width="135" height="48" rx="6" class="unit"/><text x="660" y="234" class="label">Load / store</text><text x="660" y="251" class="small">address + memory</text><rect x="850" y="95" width="125" height="65" rx="6" class="block"/><text x="860" y="115" class="label">Reorder buffer</text><text x="860" y="132" class="small">track completion</text><text x="860" y="147" class="small">commit in order</text><rect x="850" y="202" width="125" height="60" rx="6" class="block"/><text x="860" y="222" class="label">Architectural</text><text x="860" y="239" class="small">state / memory</text><text x="860" y="254" class="small">visible on commit</text><path class="wire" d="M170 120 H200"/><path class="wire" d="M380 120 H430"/><path class="wire" d="M295 160 V197"/><path class="wire" d="M380 234 H430"/><path class="wire" d="M595 120 H620 V100 H645"/><path class="wire" d="M595 130 H625 V169 H645"/><path class="wire" d="M595 140 H630 V238 H645"/><path class="wire" d="M785 100 H815 V120 H845"/><path class="wire" d="M785 169 H815 V130 H845"/><path class="wire" d="M785 238 H815 V140 H845"/><path class="wire" d="M912 160 V197"/><path class="ctrl" d="M815 170 V310 H515 V267"/><text x="520" y="326" class="small">result tags + values wake dependent instructions</text><path class="ctrl" d="M850 150 H830 V350 H190 V128 H200"/><text x="305" y="367" class="small">commit / recovery updates architectural mappings</text><text x="25" y="398" class="small">Independent younger instructions can execute early; retirement preserves program order and precise state.</text></svg>